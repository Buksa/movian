id: dev.uzver.MovianM7
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: showtime

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-download:ro
  - --persist=.hts
  - --persist=.cache/movian

modules:
  - name: movian-m7
    buildsystem: simple
    build-options:
      env:
        SKIP_SUBMODULE_UPDATE: '1'
        LIBAV_CFLAGS: -Wno-error=incompatible-pointer-types
        LIBAV_COMMON_FLAGS: >-
          --disable-inline-asm
          --disable-hwaccels
    build-commands:
      - rm -rf build.flatpak
      - >-
        ./configure.linux
        --build=flatpak
        --release
        --prefix=/app
        --disable-gu
        --disable-webkit
        --disable-dvd
        --disable-vdpau
        --disable-avahi
        --disable-libxss
        --disable-libxxf86vm
        --disable-librtmp
      - make BUILD=flatpak "$PWD/build.flatpak/movian.bundle" -j${FLATPAK_BUILDER_N_JOBS}
      - install -Dm755 build.flatpak/movian.bundle /app/bin/showtime
      - install -Dm644 support/flatpak/dev.uzver.MovianM7.desktop /app/share/applications/dev.uzver.MovianM7.desktop
      - install -Dm644 support/flatpak/dev.uzver.MovianM7.GameMode.desktop /app/share/applications/dev.uzver.MovianM7.GameMode.desktop
      - >-
        movian_version=$(git describe --always --dirty --abbrev=5 2>/dev/null || printf '0.0.0') &&
        movian_version=$(printf '%s' "$movian_version" | sed -e 's/-/./g') &&
        sed "s/@MOVIAN_VERSION@/${movian_version}/g" support/flatpak/dev.uzver.MovianM7.metainfo.xml.in > build.flatpak/dev.uzver.MovianM7.metainfo.xml &&
        install -Dm644 build.flatpak/dev.uzver.MovianM7.metainfo.xml /app/share/metainfo/dev.uzver.MovianM7.metainfo.xml
      - install -Dm644 res/showtime/showtime.png /app/share/icons/hicolor/256x256/apps/dev.uzver.MovianM7.png
      - rm -f /app/share/applications/showtime.desktop /app/share/icons/hicolor/scalable/apps/showtime.svg /app/share/icons/hicolor/256x256/apps/showtime.png
    sources:
      - type: dir
        path: ../..

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
